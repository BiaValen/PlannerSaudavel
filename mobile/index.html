<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEEBFB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Planner Saudável</title>
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita piscar claro→escuro)
    try { if (JSON.parse(localStorage.getItem("plannerSaudavel.v1") || "{}").tema === "escuro") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="app"></div>
  <noscript>Ative o JavaScript para usar o Planner Saudável.</noscript>
  <script src="dados.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
